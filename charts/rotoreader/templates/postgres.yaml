apiVersion: v1
kind: Service
metadata:
  name: rotoreader-postgres-hl
  namespace: sportsstack
spec:
  clusterIP: None
  selector:
    app: rotoreader-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rotoreader-postgres
  namespace: sportsstack
spec:
  serviceName: rotoreader-postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app: rotoreader-postgres
  template:
    metadata:
      labels:
        app: rotoreader-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: rotoreader
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d rotoreader -h 127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rotoreader-postgres
  namespace: sportsstack
spec:
  type: ClusterIP
  selector:
    app: rotoreader-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
