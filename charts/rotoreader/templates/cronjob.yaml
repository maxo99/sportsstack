apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotoreader-collect-hourly
  namespace: sportsstack
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - curl -f http://rotoreader.sportsstack.svc.cluster.local:8081/collect || exit 1
