image:
  repository: maxo5499/sportsstack-api-gateway
  tag: latest

replicas: 1

env:
  oddstrackerServiceUrl: http://oddstracker:8080
  rotoreaderServiceUrl: http://rotoreader:8081
  gosportsagentServiceUrl: http://go-sportsagent:8082

otel:
  enabled: true
  serviceName: api-gateway
  exporterEndpoint: http://observability-tempo:4317
  exporterProtocol: grpc
  exporterInsecure: true
  tracesEndpoint: http://observability-tempo:4317
  tracesProtocol: grpc
  resourceAttributes: service.namespace=sportsstack
  metricsExporter: none
  logsExporter: none
  propagators: tracecontext,baggage
  tracesSampler: parentbased_always_on
  tracesExporter: otlp
  logLevel: info

strategy:
  type: Recreate

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10

livenessProbe:
  initialDelaySeconds: 300
  periodSeconds: 30
