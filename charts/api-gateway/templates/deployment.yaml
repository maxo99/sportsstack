apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sportsstack
spec:
  replicas: {{ .Values.replicas }}
  strategy: 
    type: {{ .Values.strategy.type}}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: ODDSTRACKER_SERVICE_URL
              value: {{ .Values.env.oddstrackerServiceUrl | quote }}
            - name: ROTOREADER_SERVICE_URL
              value: {{ .Values.env.rotoreaderServiceUrl | quote }}
            - name: GOSPORTSAGENT_SERVICE_URL
              value: {{ .Values.env.gosportsagentServiceUrl | quote }}
{{- if .Values.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.exporterProtocol | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ ternary "true" "false" .Values.otel.exporterInsecure | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.otel.tracesEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: {{ .Values.otel.tracesProtocol | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.otel.metricsExporter | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.otel.logsExporter | quote }}
            - name: OTEL_PROPAGATORS
              value: {{ .Values.otel.propagators | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.otel.tracesSampler | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.otel.tracesExporter | quote }}
            - name: OTEL_LOG_LEVEL
              value: {{ .Values.otel.logLevel | quote }}
{{- if .Values.otel.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.otel.resourceAttributes | quote }}
{{- end }}
{{- end }}
          ports:
            - containerPort: 8088
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
