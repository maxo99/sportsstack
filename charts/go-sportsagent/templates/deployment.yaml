apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-sportsagent
  namespace: sportsstack
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: go-sportsagent
  template:
    metadata:
      labels:
        app: go-sportsagent
    spec:
      containers:
        - name: api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: ODDSTRACKER_SERVICE_URL
              value: {{ .Values.env.oddstrackerServiceUrl | quote }}
            - name: ROTOREADER_SERVICE_URL
              value: {{ .Values.env.rotoreaderServiceUrl | quote }}
            - name: API_GATEWAY_SERVICE_URL
              value: {{ .Values.env.apiGatewayServiceUrl | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: OPENAI_API_KEY
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
