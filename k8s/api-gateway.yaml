apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sportsstack
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: maxo5499/sportsstack-api-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: ODDSTRACKER_SERVICE_URL
          value: http://oddstracker:8080
        - name: ROTOREADER_SERVICE_URL
          value: http://rotoreader:8081
        - name: GOSPORTSAGENT_SERVICE_URL
          value: http://go-sportsagent:8082
        - name: OTEL_SERVICE_NAME
          value: api-gateway
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://observability-tempo:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: "true"
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://observability-tempo:4317
        - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
          value: grpc
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_PROPAGATORS
          value: tracecontext,baggage
        - name: OTEL_TRACES_SAMPLER
          value: parentbased_always_on
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        - name: OTEL_LOG_LEVEL
          value: debug
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=sportsstack
        ports:
        - containerPort: 8088
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 300
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sportsstack
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - port: 8088
    targetPort: 8088
    name: http
