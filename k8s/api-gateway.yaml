apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sportsstack
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: maxo5499/sportsstack-api-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: ODDSTRACKER_SERVICE_URL
          value: http://oddstracker:8080
        - name: ROTOREADER_SERVICE_URL
          value: http://rotoreader:8081
        - name: GOSPORTSAGENT_SERVICE_URL
          value: http://go-sportsagent:8082
        ports:
        - containerPort: 8088
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 300
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sportsstack
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - port: 8088
    targetPort: 8088
    name: http
